[project]
name = "memory-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.2",
    "langchain-core>=1.6.4",
    "langchain-openai>=1.6.6",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
]

[project.scripts]
memory-chatbot = "memory_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
